<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .timer {
            background: #fff0f0;
            color: #e53935;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .exam-info {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .exam-info h2 {
            margin: 0 0 6px;
        }

        .exam-info p {
            margin: 0;
            color: #777;
        }

        .progress {
            color: #555;
            font-weight: bold;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 270px;
            gap: 20px;
        }

        .question-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .question {
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #667eea;
            background: #f7f8ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #eef0ff;
        }

        .option input {
            margin-right: 10px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .previous {
            background: #e9e9e9;
        }

        .next {
            background: #667eea;
            color: white;
        }

        .submit {
            background: #e53935;
            color: white;
        }

        .sidebar {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            height: fit-content;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .question-btn {
            padding: 10px 0;
            background: #eee;
            color: #333;
        }

        .question-btn.current {
            background: #667eea;
            color: white;
        }

        .question-btn.answered {
            background: #4caf50;
            color: white;
        }

        .legend {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        .result {
            display: none;
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .result-icon {
            font-size: 60px;
        }

        .result h1 {
            margin: 10px 0;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .result-info {
            color: #666;
            line-height: 1.8;
        }

        .restart {
            margin-top: 20px;
            background: #667eea;
            color: white;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: -1;
            }

            .exam-info {
                gap: 15px;
            }
        }

        @media (max-width: 500px) {
            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 18px;
            }

            .timer {
                padding: 8px 10px;
                font-size: 13px;
            }

            .question-box {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .navigation {
                gap: 8px;
            }

            .navigation button {
                padding: 10px 13px;
            }
        }
    </style>
</head>

<body>

    <div id="examPage">

        <div class="header">
            <div class="logo">Online Exam</div>
            <div class="timer" id="timer">30:00</div>
        </div>

        <div class="container">

            <div class="exam-info">
                <div>
                    <h2>General Knowledge Test</h2>
                    <p>Answer all questions carefully.</p>
                </div>

                <div class="progress" id="progress">
                    1 / 10
                </div>
            </div>

            <div class="layout">

                <div class="question-box">

                    <div class="question-number" id="questionNumber">
                        Question 1
                    </div>

                    <div class="question" id="question">
                    </div>

                    <div class="options" id="options">
                    </div>

                    <div class="navigation">

                        <button
                            class="previous"
                            onclick="previousQuestion()"
                        >
                            Previous
                        </button>

                        <button
                            class="next"
                            id="nextButton"
                            onclick="nextQuestion()"
                        >
                            Next
                        </button>

                        <button
                            class="submit"
                            id="submitButton"
                            onclick="submitExam()"
                            style="display:none;"
                        >
                            Submit Exam
                        </button>

                    </div>

                </div>

                <div class="sidebar">

                    <h3>Questions</h3>

                    <div
                        class="question-grid"
                        id="questionGrid"
                    ></div>

                    <div class="legend">
                        🟢 Answered<br>
                        🔵 Current<br>
                        ⚪ Not answered
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="result" id="result">

        <div class="result-icon" id="resultIcon">
            🎉
        </div>

        <h1 id="resultTitle">
            Exam Completed!
        </h1>

        <div class="score" id="score">
            0 / 10
        </div>

        <div class="result-info" id="resultInfo">
        </div>

        <button
            class="restart"
            onclick="restartExam()"
        >
            Restart Exam
        </button>

    </div>

    
</body>
</html>
