<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .timer {
            background: #fff0f0;
            color: #e53935;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .exam-info {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .exam-info h2 {
            margin: 0 0 6px;
        }

        .exam-info p {
            margin: 0;
            color: #777;
        }

        .progress {
            color: #555;
            font-weight: bold;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 270px;
            gap: 20px;
        }

        .question-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .question {
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #667eea;
            background: #f7f8ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #eef0ff;
        }

        .option input {
            margin-right: 10px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .previous {
            background: #e9e9e9;
        }

        .next {
            background: #667eea;
            color: white;
        }

        .submit {
            background: #e53935;
            color: white;
        }

        .sidebar {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            height: fit-content;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .question-btn {
            padding: 10px 0;
            background: #eee;
            color: #333;
        }

        .question-btn.current {
            background: #667eea;
            color: white;
        }

        .question-btn.answered {
            background: #4caf50;
            color: white;
        }

        .legend {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        .result {
            display: none;
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .result-icon {
            font-size: 60px;
        }

        .result h1 {
            margin: 10px 0;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .result-info {
            color: #666;
            line-height: 1.8;
        }

        .restart {
            margin-top: 20px;
            background: #667eea;
            color: white;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: -1;
            }

            .exam-info {
                gap: 15px;
            }
        }

        @media (max-width: 500px) {
            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 18px;
            }

            .timer {
                padding: 8px 10px;
                font-size: 13px;
            }

            .question-box {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .navigation {
                gap: 8px;
            }

            .navigation button {
                padding: 10px 13px;
            }
        }
    </style>
</head>

<body>

    <div id="examPage">

        <div class="header">
            <div class="logo">Online Exam</div>
            <div class="timer" id="timer">30:00</div>
        </div>

        <div class="container">

            <div class="exam-info">
                <div>
                    <h2>General Knowledge Test</h2>
                    <p>Answer all questions carefully.</p>
                </div>

                <div class="progress" id="progress">
                    1 / 10
                </div>
            </div>

            <div class="layout">

                <div class="question-box">

                    <div class="question-number" id="questionNumber">
                        Question 1
                    </div>

                    <div class="question" id="question">
                    </div>

                    <div class="options" id="options">
                    </div>

                    <div class="navigation">

                        <button
                            class="previous"
                            onclick="previousQuestion()"
                        >
                            Previous
                        </button>

                        <button
                            class="next"
                            id="nextButton"
                            onclick="nextQuestion()"
                        >
                            Next
                        </button>

                        <button
                            class="submit"
                            id="submitButton"
                            onclick="submitExam()"
                            style="display:none;"
                        >
                            Submit Exam
                        </button>

                    </div>

                </div>

                <div class="sidebar">

                    <h3>Questions</h3>

                    <div
                        class="question-grid"
                        id="questionGrid"
                    ></div>

                    <div class="legend">
                        🟢 Answered<br>
                        🔵 Current<br>
                        ⚪ Not answered
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="result" id="result">

        <div class="result-icon" id="resultIcon">
            🎉
        </div>

        <h1 id="resultTitle">
            Exam Completed!
        </h1>

        <div class="score" id="score">
            0 / 10
        </div>

        <div class="result-info" id="resultInfo">
        </div>

        <button
            class="restart"
            onclick="restartExam()"
        >
            Restart Exam
        </button>

    </div>

    <script>
        const questions = [
            {
                question: "Which language is primarily used for web page structure?",
                options: ["Python", "HTML", "Java", "C++"],
                answer: 1
            },
            {
                question: "Which planet is known as the Red Planet?",
                options: ["Earth", "Venus", "Mars", "Jupiter"],
                answer: 2
            },
            {
                question: "What is the capital of India?",
                options: ["Mumbai", "New Delhi", "Kolkata", "Chennai"],
                answer: 1
            },
            {
                question: "Which data structure follows FIFO?",
                options: ["Stack", "Queue", "Tree", "Graph"],
                answer: 1
            },
            {
                question: "Which company developed Java?",
                options: ["Microsoft", "Sun Microsystems", "Apple", "IBM"],
                answer: 1
            },
            {
                question: "How many continents are there?",
                options: ["5", "6", "7", "8"],
                answer: 2
            },
            {
                question: "Which HTML tag is used to create a hyperlink?",
                options: ["<link>", "<a>", "<href>", "<url>"],
                answer: 1
            },
            {
                question: "What does CPU stand for?",
                options: [
                    "Central Processing Unit",
                    "Computer Personal Unit",
                    "Central Program Utility",
                    "Computer Processing Utility"
                ],
                answer: 0
            },
            {
                question: "Which one is a JavaScript framework?",
                options: ["React", "MySQL", "Python", "MongoDB"],
                answer: 0
            },
            {
                question: "Which number is a prime number?",
                options: ["21", "27", "29", "33"],
                answer: 2
            }
        ];

        let currentQuestion = 0;
        let userAnswers = Array(questions.length).fill(null);
        let timeLeft = 30 * 60;
        let timer;

        function loadQuestion() {

            let q = questions[currentQuestion];

            document.getElementById("questionNumber")
                .textContent =
                "Question " + (currentQuestion + 1);

            document.getElementById("question")
                .textContent = q.question;

            document.getElementById("progress")
                .textContent =
                (currentQuestion + 1) +
                " / " +
                questions.length;

            let options =
                document.getElementById("options");

            options.innerHTML = "";

            q.options.forEach(function(option, index) {

                let label =
                    document.createElement("label");

                label.className = "option";

                if (userAnswers[currentQuestion] === index) {
                    label.classList.add("selected");
                }

                label.innerHTML =
                    "<input type='radio' name='option' value='" +
                    index +
                    "' " +
                    (userAnswers[currentQuestion] === index
                        ? "checked"
                        : "") +
                    ">" +
                    option;

                label.onclick = function() {
                    selectAnswer(index);
                };

                options.appendChild(label);
            });

            updateNavigation();
            createQuestionButtons();
        }

        function selectAnswer(index) {

            userAnswers[currentQuestion] = index;

            loadQuestion();
        }

        function nextQuestion() {

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        }

        function previousQuestion() {

            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function goToQuestion(index) {

            currentQuestion = index;
            loadQuestion();
        }

        function updateNavigation() {

            let previous =
                document.querySelector(".previous");

            previous.style.visibility =
                currentQuestion === 0
                    ? "hidden"
                    : "visible";

            let next =
                document.getElementById("nextButton");

            let submit =
                document.getElementById("submitButton");

            if (currentQuestion === questions.length - 1) {
                next.style.display = "none";
                submit.style.display = "block";
            }
            else {
                next.style.display = "block";
                submit.style.display = "none";
            }
        }

        function createQuestionButtons() {

            let grid =
                document.getElementById("questionGrid");

            grid.innerHTML = "";

            questions.forEach(function(q, index) {

                let button =
                    document.createElement("button");

                button.className = "question-btn";

                button.textContent = index + 1;

                if (index === currentQuestion) {
                    button.classList.add("current");
                }

                if (userAnswers[index] !== null) {
                    button.classList.add("answered");
                }

                button.onclick = function() {
                    goToQuestion(index);
                };

                grid.appendChild(button);
            });
        }

        function startTimer() {

            timer = setInterval(function() {

                timeLeft--;

                let minutes =
                    Math.floor(timeLeft / 60);

                let seconds =
                    timeLeft % 60;

                document.getElementById("timer")
                    .textContent =
                    String(minutes).padStart(2, "0") +
                    ":" +
                    String(seconds).padStart(2, "0");

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitExam();
                }

            }, 1000);
        }

        function submitExam() {

            let unanswered =
                userAnswers.filter(function(answer) {
                    return answer === null;
                }).length;

            if (unanswered > 0 && timeLeft > 0) {

                let confirmSubmit =
                    confirm(
                        "You have " +
                        unanswered +
                        " unanswered question(s). Submit anyway?"
                    );

                if (!confirmSubmit) {
                    return;
                }
            }

            clearInterval(timer);

            let score = 0;

            questions.forEach(function(q, index) {

                if (userAnswers[index] === q.answer) {
                    score++;
                }

            });

            let percentage =
                Math.round(
                    (score / questions.length) * 100
                );

            document.getElementById("examPage")
                .style.display = "none";

            document.getElementById("result")
                .style.display = "block";

            document.getElementById("score")
                .textContent =
                score + " / " + questions.length;

            document.getElementById("resultInfo")
                .innerHTML =
                "Percentage: <b>" +
                percentage +
                "%</b><br>" +
                "Correct Answers: <b>" +
                score +
                "</b><br>" +
                "Wrong Answers: <b>" +
                (questions.length - score) +
                "</b><br>" +
                "Unanswered: <b>" +
                unanswered +
                "</b>";

            if (percentage >= 40) {
                document.getElementById("resultIcon")
                    .textContent = "🎉";

                document.getElementById("resultTitle")
                    .textContent = "Congratulations! You Passed";
            }
            else {
                document.getElementById("resultIcon")
                    .textContent = "📚";

                document.getElementById("resultTitle")
                    .textContent = "Keep Practicing!";
            }
        }

        function restartExam() {

            currentQuestion = 0;
            userAnswers =
                Array(questions.length).fill(null);

            timeLeft = 30 * 60;

            document.getElementById("examPage")
                .style.display = "block";

            document.getElementById("result")
                .style.display = "none";

            document.getElementById("timer")
                .textContent = "30:00";

            loadQuestion();
            startTimer();
        }

        loadQuestion();
        startTimer();
    </script>

</body>
</html>
